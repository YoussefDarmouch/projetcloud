<!DOCTYPE html>
<html lang="fr">

<head>
    <script>
        // Check authentication immediately - MUST be first
        if (!localStorage.getItem('token')) {
            window.location.replace('../index.html');
        }
    </script>
    <meta charset="UTF-8">
    <title>Classement Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="dashboard">
        <button onclick="window.location.href='../home.html'"
            style="background-color: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px;">
            ⬅️ Retour à l'accueil
        </button>

        <h1>🏆 Classement Dashboard</h1>

        <button onclick="window.location.href='formclassement.html'">
            Ajouter Équipe
        </button>

        <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchClassements()">

        <table>
            <thead>
                <tr>
                    <th>#</th> <!-- Nouvelle colonne pour le numéro -->
                    <th>Équipe</th>
                    <th>Championnat</th>
                    <th>MJ</th>
                    <th>G</th>
                    <th>N</th>
                    <th>P</th>
                    <th>Diff</th>
                    <th>Pts</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script src="./classmants.js"></script>
</body>

</html>
