<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Equipes Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Bouton Retour à l'accueil -->
        <button onclick="window.location.href='../home.html'" style="background-color: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px;">
            ⬅️ Retour à l'accueil
        </button>

        <h1>🏆 Equipes Dashboard</h1>
        
        <button onclick="window.location.href='formequipe.html'">
            Ajouter Equipe
        </button>

        <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchEquipes()">

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Pays</th>
                    <th>Ville</th>
                    <th>Stade</th>
                    <th>Capacité</th>
                    <th>Entraîneur</th>
                    <th>Année</th>
                    <th>Couleurs</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="list"></tbody>
        </table>

    </div>

    <script src="./equipes.js"></script>

</body>

</html>
