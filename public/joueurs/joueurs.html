<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Joueurs Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Bouton Retour à l'accueil -->
        <button onclick="window.location.href='../home.html'" style="background-color: #161b22; color: #8b949e; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px;">
            ⬅️ Retour à l'accueil
        </button>

        <h1>⚽ Joueurs Dashboard</h1>
        
        <button onclick="window.location.href='formjoueur.html'">
            Ajouter Joueur
        </button>

        <input type="text" id="search" placeholder="🔍 Search..." onkeyup="searchJoueurs()">

        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Age</th>
                    <th>Poste</th>
                    <th>Club</th>
                    <th>numero</th>
                    <th>nationalite</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="list"></tbody>
        </table>

    </div>

    <script src="./joueurs.js"></script>

</body>

</html>
